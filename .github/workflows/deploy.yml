name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests (offline; Azure is never called)
        run: |
          pip install -r backend/requirements.txt -r payment_api/requirements.txt
          python -m pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Lint and build the website
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # GitHub OIDC token -> Azure; no password is stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build the image in Azure Container Registry
        run: |
          az acr build -r "${{ vars.ACR_NAME }}" -t "behave-kyndryl:${GITHUB_SHA::7}" -t behave-kyndryl:latest \
            -f deploy/app.Containerfile .
      - name: Roll out the new image
        run: |
          az containerapp update -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.CONTAINER_APP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/behave-kyndryl:${GITHUB_SHA::7}" -o none
      - name: Check health
        run: |
          fqdn="$(az containerapp show -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.CONTAINER_APP }}" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 30); do
            if curl -fsS "https://$fqdn/api/v1/health"; then exit 0; fi
            sleep 10
          done
          echo "The new revision did not become healthy" >&2
          exit 1
